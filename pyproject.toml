[project]
name = "xbloom-py"
version = "0.2.0"
description = "Async Python library for xBloom Studio coffee brewers: BLE protocol, recipes, OTA and cloud"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Mansour Alshekhi" }]
keywords = ["xbloom", "coffee", "brewing", "ble", "bluetooth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22", "bleak-retry-connector>=3.5"]
cloud = ["aiohttp>=3.9", "cryptography>=42"]
all = ["xbloom-py[ble,cloud]"]

[project.urls]
Homepage = "https://github.com/Alshekhi/xbloom-py"
Issues = "https://github.com/Alshekhi/xbloom-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xbloom"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
